<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Лабораторные работы по веб-разработке">
    <title>Лабораторные работы</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: radial-gradient(circle at 15% 10%, #312e81 0, transparent 32rem), #0b1020;
      }

      main { width: min(100%, 64rem); }

      h1 {
        margin: 0 0 0.6rem;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
      }

      p { color: #cbd5e1; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr));
        gap: 1rem;
        margin-top: 2rem;
      }

      a {
        display: grid;
        min-height: 9rem;
        align-content: end;
        gap: 0.35rem;
        padding: 1.4rem;
        border: 1px solid #334155;
        border-radius: 1.25rem;
        color: #f8fafc;
        background: #111827;
        text-decoration: none;
        transition: transform 160ms ease, border-color 160ms ease;
      }

      a:hover { transform: translateY(-3px); border-color: #818cf8; }
      a:focus-visible { outline: 3px solid #c084fc; outline-offset: 4px; }
      strong { font-size: 1.25rem; }
      span { color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Лабораторные работы</h1>
      <p>Каждая работа опубликована независимо и открывается по собственному адресу.</p>
      <nav class="grid" aria-label="Список лабораторных работ">
        <a href="./lab-4/"><strong>Лабораторная №4</strong><span>Sass</span></a>
        <a href="./lab-4-tailwind/"><strong>Лабораторная №4</strong><span>Tailwind CSS</span></a>
        <a href="./lab-5/"><strong>Лабораторная №5</strong><span>Основы Vue</span></a>
        <a href="./lab-6/"><strong>Лабораторная №6</strong><span>To-Do на Vue 3</span></a>
        <a href="./lab-7/"><strong>Лабораторная №7</strong><span>Pinia и Vue Router</span></a>
      </nav>
    </main>
  </body>
</html>
